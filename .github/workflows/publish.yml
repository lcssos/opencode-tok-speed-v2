name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # OIDC：让 npm 验证这个 workflow 的身份，无需保管任何 token
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # 发布构建不要用依赖缓存
          package-manager-cache: false

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json = $PKG_VERSION, tag = $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ($TAG_VERSION) 与 package.json ($PKG_VERSION) 版本不一致"
            exit 1
          fi

      - name: 检查 npm 版本已存在
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "opencode-tok-speed-v2@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::npm 上已存在 $PKG_VERSION，请先提升版本号"
            exit 1
          fi
          echo "版本 $PKG_VERSION 尚未发布，继续"

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 发布入口必须是预编译好的 tui.js：插件装在 node_modules 里时，
      # OpenCode 不会对 node_modules 内的 .tsx 做 solid JSX 转译。
      - name: 校验 tui.js 与 tui.tsx 同步
        run: |
          node scripts/build.mjs
          if [ -n "$(git status --porcelain -- tui.js)" ]; then
            echo "::error::tui.js 与 tui.tsx 不同步，请在本地执行 npm run build 并把 tui.js 一起提交"
            git --no-pager diff --stat -- tui.js
            exit 1
          fi
          echo "tui.js 与 tui.tsx 一致"

      - name: 校验入口无残留 JSX
        run: |
          if grep -qE '\bjsxDEV?\s*\(' tui.js; then
            echo "::error::tui.js 里仍有未转译的 JSX，安装后会在 node_modules 内解析失败"
            exit 1
          fi
          echo "入口检查通过，产物大小：$(wc -c <tui.js) 字节"

      - name: 打包检查（不发布）
        run: npm pack --dry-run

      - name: 发布到 npm
        run: npm publish --access public

      - name: 输出结果
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "### 已发布 opencode-tok-speed-v2@$PKG_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/opencode-tok-speed-v2/v/$PKG_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- 安装: \`opencode plugin add opencode-tok-speed-v2\`" >> "$GITHUB_STEP_SUMMARY"
